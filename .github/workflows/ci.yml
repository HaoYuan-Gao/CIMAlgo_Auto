name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Unit tests
        # 硬件测试默认被跳过; CI 只跑不依赖设备和 SDK 的部分
        run: pytest tests/unit -q --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml
